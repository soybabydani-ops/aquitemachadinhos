<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Busca — Aqui Tem Achadinhos (Barretos)</title>
<meta name="description" content="Encontre lojas, serviços e produtos em Barretos.">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B1E3F">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Achadinhos">
<link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="assets/tailwind.css"><link rel="stylesheet" href="assets/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body data-page="busca" class="bg-silver-100 text-navy-900">
<div id="site-header"></div>
<section class="navy-hero text-white relative overflow-hidden"><div class="absolute inset-0 dot-grid opacity-40"></div>
  <div class="relative max-w-3xl mx-auto px-4 sm:px-6 py-12 md:py-16">
    <h1 id="buscaTitulo" class="font-display text-3xl md:text-4xl font-extrabold text-chrome">Busca</h1>
    <form action="busca.html" method="get" class="mt-5 glass rounded-2xl p-2 shadow-glow flex gap-2">
      <input id="q" name="q" type="text" placeholder="Buscar loja, produto, serviço..." class="flex-1 px-4 py-3 rounded-xl text-navy-900 outline-none bg-white placeholder:text-silver-500">
      <button class="btn-shine bg-peao-500 hover:bg-peao-600 text-white font-bold px-6 rounded-xl">Buscar</button>
    </form>
  </div>
</section>
<section class="max-w-7xl mx-auto px-4 sm:px-6 py-10"><div id="resBusca"></div></section>
<div id="site-footer"></div>
<script src="assets/app.js"></script>
</body>
</html>
