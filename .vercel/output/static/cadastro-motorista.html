<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cadastrar como motorista em Barretos — Aqui Tem Achadinhos</title>
<meta name="description" content="Cadastre-se como motorista no guia de Barretos. Grátis no lançamento. Receba pedidos de corrida pelo WhatsApp.">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B1E3F">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Achadinhos">
<link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="assets/tailwind.css"><link rel="stylesheet" href="assets/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body data-page="cadmotorista" class="bg-silver-100 text-navy-900">
<div id="site-header"></div>
<section class="navy-hero text-white relative overflow-hidden"><div class="absolute inset-0 dot-grid opacity-40"></div>
  <div class="relative max-w-3xl mx-auto px-4 sm:px-6 py-12 md:py-16">
    <span class="text-peao-400 font-bold uppercase text-xs tracking-[0.18em]">Para motoristas · grátis no lançamento</span>
    <h1 class="font-display text-3xl md:text-5xl font-extrabold mt-2 text-chrome">Cadastre-se como motorista</h1>
    <p class="text-silver-200 mt-2">Receba pedidos de corrida pelo WhatsApp — principal na época da Festa do Peão.</p>
  </div>
</section>
<section class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
  <form id="formMotorista" class="bg-white rounded-3xl shadow-soft ring-silver p-6 md:p-8 space-y-5" novalidate>
    <div><label class="block text-sm font-semibold mb-1.5">Nome *</label><input name="nome" type="text" required class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"></div>
    <div class="grid sm:grid-cols-2 gap-5">
      <div><label class="block text-sm font-semibold mb-1.5">WhatsApp *</label><input name="whatsapp" type="tel" placeholder="(17) 9XXXX-XXXX" class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"></div>
      <div><label class="block text-sm font-semibold mb-1.5">Telefone</label><input name="telefone" type="tel" class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"></div>
    </div>
    <div class="grid sm:grid-cols-3 gap-5">
      <div><label class="block text-sm font-semibold mb-1.5">Veículo</label><select name="tipo_veiculo" class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"><option>Carro</option><option>Moto</option><option>Van</option><option>Outro</option></select></div>
      <div><label class="block text-sm font-semibold mb-1.5">Placa (opcional)</label><input name="placa" type="text" placeholder="ABC-1234" class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"></div>
      <div><label class="block text-sm font-semibold mb-1.5">Lotação</label><input name="lotacao" type="text" placeholder="Ex.: 4 pax" class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"></div>
    </div>
    <div class="grid sm:grid-cols-2 gap-5">
      <div><label class="block text-sm font-semibold mb-1.5">Disponibilidade</label><select name="disponibilidade" class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"><option>24h — plantão</option><option>Diurno (dia)</option><option>Noite e madrugada</option><option>Fins de semana</option><option>Sob agendamento</option></select></div>
      <div><label class="block text-sm font-semibold mb-1.5">Bairro / base</label><input name="bairro" type="text" class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"></div>
    </div>
    <div><label class="block text-sm font-semibold mb-1.5">Atende (regiões)</label><input name="area" type="text" placeholder="Centro, rodoviária, Parque do Peão, cidades vizinhas..." class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"></div>
    <div><label class="block text-sm font-semibold mb-1.5">Descrição</label><textarea name="descricao" rows="2" placeholder="Conte um pouco sobre seu serviço..." class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"></textarea></div>
    <div><label class="block text-sm font-semibold mb-1.5">Foto (você ou o veículo)</label><input name="foto" type="file" accept="image/*" class="text-sm"></div>
    <label class="flex items-start gap-2 text-sm text-slate-600"><input name="aceite" type="checkbox" class="mt-0.5 w-4 h-4 accent-peao-500"> Aceito os <a href="termos.html" class="text-peao-600 underline">termos</a>, confirmo que estou autorizado a me cadastrar e entendo que o site é um diretório (conecta passageiro e motorista via WhatsApp; não intermedeia a corrida). *</label>
    <div id="msg" role="status" aria-live="polite"></div>
    <button type="submit" class="btn-shine w-full bg-peao-500 hover:bg-peao-600 text-white font-bold py-3.5 rounded-xl shadow-redglow">Cadastrar</button>
  </form>
  <div id="motOk" class="hidden bg-white rounded-3xl shadow-soft ring-silver p-8 text-center mt-2">
    <div class="text-5xl">🚗</div>
    <h2 class="font-display text-2xl font-extrabold mt-3">Cadastro enviado!</h2>
    <p class="text-slate-600 mt-2">Seu perfil foi registrado como <b>pendente</b>. Após aprovação, você aparece no diretório de motoristas.</p>
    <a href="motoristas.html" class="btn-shine inline-block mt-5 bg-navy-800 hover:bg-navy-700 text-white font-bold px-6 py-3 rounded-xl">Ver motoristas</a>
  </div>
</section>
<div id="site-footer"></div>
<script src="assets/app.js"></script>
</body>
</html>
