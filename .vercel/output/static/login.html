<body data-page="login" class="bg-silver-100 text-navy-900">
<div id="site-header"></div>
<section class="navy-hero text-white relative overflow-hidden"><div class="absolute inset-0 dot-grid opacity-40"></div>
  <div class="relative max-w-md mx-auto px-4 sm:px-6 py-14 md:py-20">
    <h1 class="font-display text-3xl md:text-4xl font-extrabold text-chrome">Área do administrador</h1>
    <p class="text-silver-200 mt-2">Acesso restrito. Entre com seu e-mail e senha de administrador.</p>
  </div>
</section>
<section class="max-w-md mx-auto px-4 sm:px-6 py-10">
  <form id="formLogin" class="bg-white rounded-3xl shadow-soft ring-silver p-6 md:p-8 space-y-4" novalidate>
    <div><label class="block text-sm font-semibold mb-1.5">E-mail</label><input name="email" type="email" autocomplete="username" required class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"></div>
    <div><label class="block text-sm font-semibold mb-1.5">Senha</label><input name="password" type="password" autocomplete="current-password" required class="w-full px-4 py-3 rounded-xl bg-silver-50 ring-silver outline-none focus:ring-2 focus:ring-navy-500"></div>
    <div id="msg" role="status" aria-live="polite"></div>
    <button type="submit" class="btn-shine w-full bg-peao-500 hover:bg-peao-600 text-white font-bold py-3.5 rounded-xl shadow-redglow">Entrar</button>
  </form>
  <p class="text-xs text-slate-500 mt-4 text-center">É o primeiro acesso? Crie seu usuário em <b>Supabase → Authentication → Users → Add user</b> (marque "Auto Confirm User").</p>
  <p class="text-xs text-slate-400 mt-2 text-center"><a href="index.html" class="hover:text-navy-700">← Voltar ao site</a></p>
</section>
