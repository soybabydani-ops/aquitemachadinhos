<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Redirecionando para Oferta Oficial de Viagem... | AQUITEM</title>
<meta name="robots" content="index, follow">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#030712;color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;text-align:center}
  .redirect-card{max-width:480px;width:100%;background:#091428;border:2px solid #F5D77F;border-radius:24px;padding:32px 20px;box-shadow:0 0 35px rgba(245,215,127,0.3)}
  .spinner{width:44px;height:44px;border:4px solid rgba(245,215,127,0.2);border-top-color:#F5D77F;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:1.4rem;font-weight:900;margin-bottom:8px;color:#FFF}
  p{font-size:0.85rem;color:#CBD5E1;line-height:1.4;margin-bottom:20px}
  .btn-direct{display:block;width:100%;background:linear-gradient(135deg,#FFE259,#FFA751);color:#0B1426;font-weight:900;padding:14px;border-radius:12px;text-decoration:none;font-size:0.9rem;text-transform:uppercase;box-shadow:0 4px 15px rgba(245,215,127,0.4)}
</style>
</head>
<body>

<div class="redirect-card">
  <div class="spinner"></div>
  <div style="display:inline-block;background:rgba(16,185,129,0.2);color:#10B981;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;margin-bottom:10px;border:1px solid #10B981">
    ✓ CUPOM ATIVO VALIDADO
  </div>
  <h1 id="redTitle">Conectando à Tarifa Promocional...</h1>
  <p id="redDesc">Aguarde 1 segundo enquanto nosso robô direciona para o assento com desconto exclusivo garantido.</p>

  <a id="redBtn" href="https://www.clickbus.com.br/?ref=aquitem_nacional" class="btn-direct">
    👉 Acessar Assento Promocional Imediato &rarr;
  </a>
</div>

<script>
(function() {
  var urlParams = new URLSearchParams(window.location.search);
  var slug = urlParams.get('rota') || urlParams.get('slug') || '';
  var ref = document.referrer || 'direct';

  var SUPABASE_URL = "https://efvuzxdhsirpvxclgdfg.supabase.co/rest/v1";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmdnV6eGRoc2lycHZ4Y2xnZGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDM1OTEsImV4cCI6MjEwMTA3OTU5MX0.nPVBBKO_W9-tAccFRv7ajnllxTXvkqbsVsYecDqyeQc";

  var defaultTarget = "https://www.clickbus.com.br/?ref=aquitem_nacional";

  function executeRedirect(targetUrl, title) {
    var btn = document.getElementById('redBtn');
    var tit = document.getElementById('redTitle');
    if (btn) btn.href = targetUrl;
    if (tit && title) tit.textContent = title;

    // Registra log do clique no banco
    fetch(SUPABASE_URL + "/redirecionamentos_afiliados_stats", {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ rota_slug: slug || 'direto', referrer: ref, criado_em: new Date().toISOString() })
    }).catch(function(){});

    // Redirecionamento instantâneo em 800ms
    setTimeout(function() {
      window.location.href = targetUrl;
    }, 800);
  }

  if (slug) {
    fetch(SUPABASE_URL + "/feeds_promocoes_viagens?slug=eq." + encodeURIComponent(slug) + "&select=link_destino,titulo&limit=1", {
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY }
    }).then(function(r){ return r.json(); }).then(function(rows) {
      if (rows && rows.length > 0 && rows[0].link_destino) {
        executeRedirect(rows[0].link_destino, rows[0].titulo);
      } else {
        executeRedirect(defaultTarget, "Redirecionando para Passagem Promocional...");
      }
    }).catch(function() {
      executeRedirect(defaultTarget, "Redirecionando para Passagem Promocional...");
    });
  } else {
    executeRedirect(defaultTarget, "Redirecionando para Passagem Promocional...");
  }
})();
</script>
</body>
</html>
