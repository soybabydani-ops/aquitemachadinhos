<!-- ETAPA 4: Templates HTML dos cards e paywall -->

<!-- ── Card GRÁTIS ─────────────────────────────────────── -->
<div class="store-card" data-plano="gratis">
  <img class="store-logo" src="{{ logo_url }}" alt="{{ nome }}">
  <h3 class="store-name">{{ nome }}</h3>
  <p class="store-desc">{{ descricao_curta }}</p>
  <a class="btn-whatsapp" href="https://wa.me/{{ whatsapp }}">💬 WhatsApp</a>
</div>

<!-- ── Card DESTAQUE ───────────────────────────────────── -->
<div class="store-card" data-plano="destaque">
  <!-- ::before renderiza o selo automaticamente via CSS -->
  <span class="badge-destaque">⭐ Destaque</span>
  <img class="store-logo" src="{{ logo_url }}" alt="{{ nome }}">
  <h3 class="store-name">{{ nome }}</h3>
  <p class="store-desc">{{ descricao_curta }}</p>
  <a class="btn-whatsapp" href="https://wa.me/{{ whatsapp }}">💬 WhatsApp</a>
</div>

<!-- ── Card PRO ────────────────────────────────────────── -->
<div class="store-card" data-plano="pro">
  <!-- ::before renderiza "🏆 Recomendado" via CSS -->
  <span class="badge-pro">🏆 Pro</span>
  <img class="store-logo" src="{{ logo_url }}" alt="{{ nome }}">
  <h3 class="store-name">{{ nome }}</h3>
  <p class="store-desc">{{ descricao_curta }}</p>
  <a class="btn-whatsapp" href="https://wa.me/{{ whatsapp }}">💬 WhatsApp</a>
</div>

<!-- ── Skeleton Loader (durante carregamento) ──────────── -->
<div class="store-card-skeleton">
  <div class="skeleton-line h-12 w-75"></div>
  <div class="skeleton-line h-4  w-75"></div>
  <div class="skeleton-line h-4  w-50"></div>
  <div class="skeleton-line h-6  w-50"></div>
</div>

<!-- ── Paywall: relatório bloqueado para Grátis ────────── -->
<div class="paywall-overlay">
  <!-- Conteúdo desfocado atrás -->
  <div class="paywall-content">
    <canvas id="chart-fake" width="400" height="200"></canvas>
    <p>Visualizações: 1.234 | Cliques: 89</p>
  </div>

  <!-- Gate de upgrade -->
  <div class="paywall-gate">
    <div class="paywall-gate__icon">🔒</div>
    <div class="paywall-gate__title">Recurso exclusivo</div>
    <div class="paywall-gate__desc">
      Relatórios de visitas e cliques estão disponíveis
      nos planos <strong>Destaque</strong> e <strong>Pro</strong>.
    </div>
    <button class="paywall-gate__btn"
            onclick="location.href='/planos.html?origem=relatorio'">
      Ver planos — a partir de R$ 79/mês
    </button>
  </div>
</div>
